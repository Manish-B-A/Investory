<div class="app-layout">
  <!-- Sidebar (Desktop) -->
  <aside class="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="2" y="2" width="24" height="24" rx="6" stroke="currentColor" stroke-width="2"/>
          <path d="M8 18L12 10L16 14L20 8" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="brandGrad" x1="8" y1="18" x2="20" y2="8">
              <stop stop-color="#6c63ff"/>
              <stop offset="1" stop-color="#a8a2ff"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="brand-name">Investory</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" id="nav-dashboard">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="2" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="2" width="7" height="4" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <rect x="2" y="11" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="8" width="7" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/monthly" routerLinkActive="active" class="nav-item" id="nav-monthly">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <line x1="2" y1="7" x2="18" y2="7" stroke="currentColor" stroke-width="1.5"/>
          <line x1="6" y1="3" x2="6" y2="1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="14" y1="3" x2="14" y2="1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="7" cy="11" r="1" fill="currentColor"/>
          <circle cx="10" cy="11" r="1" fill="currentColor"/>
          <circle cx="13" cy="11" r="1" fill="currentColor"/>
          <circle cx="7" cy="14" r="1" fill="currentColor"/>
        </svg>
        <span>Monthly</span>
      </a>

      <a routerLink="/investments" routerLinkActive="active" class="nav-item" id="nav-investments">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 2L18 6V14L10 18L2 14V6L10 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M10 10V18" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 10L18 6" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 10L2 6" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>Investments</span>
      </a>

      <a routerLink="/reports" routerLinkActive="active" class="nav-item" id="nav-reports">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 16V10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 16V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 16V8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 16V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Reports</span>
      </a>

      <a routerLink="/settings" routerLinkActive="active" class="nav-item" id="nav-settings">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 1V3M10 17V19M1 10H3M17 10H19M3.5 3.5L5 5M15 15L16.5 16.5M16.5 3.5L15 5M5 15L3.5 16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div
        class="sync-indicator"
        [attr.data-status]="syncState().status"
        [title]="syncState().message || syncLabel()"
      >
        <span class="sync-dot" aria-hidden="true"></span>
        <span class="sync-text">{{ syncLabel() }}</span>
      </div>
      <div class="sidebar-version">v1.0.0</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" role="main">
    <router-outlet />
  </main>

  <!-- Bottom Navigation (Mobile) -->
  <nav class="bottom-nav" role="navigation" aria-label="Mobile navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="bottom-nav-item" id="mobile-nav-dashboard">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="2" y="2" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="11" y="2" width="7" height="4" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="2" y="11" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="11" y="8" width="7" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span>Dashboard</span>
    </a>
    <a routerLink="/monthly" routerLinkActive="active" class="bottom-nav-item" id="mobile-nav-monthly">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <line x1="2" y1="7" x2="18" y2="7" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="7" cy="11" r="1" fill="currentColor"/>
        <circle cx="10" cy="11" r="1" fill="currentColor"/>
        <circle cx="13" cy="11" r="1" fill="currentColor"/>
      </svg>
      <span>Monthly</span>
    </a>
    <a routerLink="/investments" routerLinkActive="active" class="bottom-nav-item" id="mobile-nav-investments">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 2L18 6V14L10 18L2 14V6L10 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M10 10V18" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 10L18 6" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 10L2 6" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span>Investments</span>
    </a>
    <a routerLink="/reports" routerLinkActive="active" class="bottom-nav-item" id="mobile-nav-reports">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M4 16V10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M8 16V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 16V8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M16 16V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Reports</span>
    </a>
    <a routerLink="/settings" routerLinkActive="active" class="bottom-nav-item" id="mobile-nav-settings">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 1V3M10 17V19M1 10H3M17 10H19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>Settings</span>
    </a>
  </nav>
</div>

<!-- Toast Container -->
<app-toast />

<app-confirm-dialog
  [open]="migrationOpen()"
  title="Upload local data?"
  message="We found investment data on this device that is not in your cloud account. Upload it to your account, or keep cloud data separate and start fresh on this account."
  confirmText="Upload local data"
  cancelText="Keep separate"
  (confirmed)="onUploadLocal()"
  (cancelled)="onKeepSeparate()"
/>
