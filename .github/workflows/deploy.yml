name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        # Replace 'Investory' with your repository name if different
        run: npm run build -- --configuration production --base-href /Investory/

      # Generate 404.html for Angular routing on GitHub Pages
      - name: Setup 404 Page
        run: cp dist/investory/browser/index.html dist/investory/browser/404.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/investory/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
